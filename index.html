<style>
/* Layout: sticky bar, hero with a live "query" card, then ledger-style sections (label column left, content right). Dark-first.
   Palette: PulseID logo — deep navy, royal blue, teal, turquoise. */
:root{
  color-scheme:dark;
  --bg:#06112b; --surface:#0b1c42; --line:#1a3366; --fg:#e8f1ff; --muted:#93a8cc;
  --accent:#16dccf; --accent-ink:#04122e; --warm:#4f9dff;
  --grad:linear-gradient(120deg,#0a3fbf 0%,#0a7bd8 45%,#14e0d2 100%);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f2f7fc; --surface:#ffffff; --line:#cfdcef; --fg:#0a1d4a; --muted:#4c5f80;
  --accent:#0b47c4; --accent-ink:#ffffff; --warm:#007c88;
  --grad:linear-gradient(120deg,#0a2a8a 0%,#0b55c8 45%,#00a8b5 100%);
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f2f7fc; --surface:#ffffff; --line:#cfdcef; --fg:#0a1d4a; --muted:#4c5f80;
  --accent:#0b47c4; --accent-ink:#ffffff; --warm:#007c88;
  --grad:linear-gradient(120deg,#0a2a8a 0%,#0b55c8 45%,#00a8b5 100%);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--fg);font:400 16px/1.65 var(--body)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:20px}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:700;white-space:nowrap}
.brand b{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--grad);color:#fff;font-size:.9rem}
.bar nav{display:flex;gap:20px;margin-left:auto;overflow-x:auto;min-width:0}
.bar nav a{text-decoration:none;color:var(--muted);font-size:.92rem;white-space:nowrap;padding-block:6px}
.bar nav a:hover{color:var(--fg)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{font:500 .78rem var(--mono);background:none;border:0;color:var(--muted);padding:7px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.theme{flex:none;display:grid;place-items:center;width:36px;height:34px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--fg);cursor:pointer;font-size:1rem;line-height:1}
.theme:hover{border-color:var(--accent);color:var(--accent)}
/* Pantallas medianas y pequenas: el menu pasa a una segunda fila desplazable */
@media (max-width:900px){
  html{scroll-padding-top:112px}
  .bar .wrap{flex-wrap:wrap;gap:8px 12px;padding-block:8px 0;min-height:0}
  .bar .lang{margin-left:auto}
  .bar nav{order:3;flex:1 0 100%;margin:0 -20px;padding:2px 20px 8px;gap:6px;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 24px),transparent);
            mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 24px),transparent)}
  .bar nav::-webkit-scrollbar{display:none}
  .bar nav a{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:.86rem}
  .bar nav a:hover{border-color:var(--accent)}
}
@media (max-width:420px){
  .wrap{padding-inline:16px}
  .bar nav{margin:0 -16px;padding-inline:16px}
  .brand span{display:none}
  .hero h1{font-size:clamp(2.2rem,11vw,2.6rem)}
  .btn{padding:10px 14px}
  .cta .btn{flex:1 1 auto;justify-content:center}
  .line{padding:14px 16px}
  .line .btn{width:100%;justify-content:center}
  .query .row{grid-template-columns:1fr}
  .query .row span.when{text-align:left;grid-row:2}
}
/* Pantallas grandes */
@media (min-width:1440px){
  .wrap{max-width:1200px}
  body{font-size:17px}
}
@media (min-width:1920px){
  .wrap{max-width:1320px}
  body{font-size:18px}
}

.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:center;padding-block:64px 56px}
.hero h1{font:700 clamp(2.6rem,7vw,4.6rem)/.98 var(--display);letter-spacing:-.02em;margin:14px 0 18px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent);background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.role{font:500 1.15rem var(--body);color:var(--warm);margin:0 0 16px}
.hero p.lead{max-width:60ch;color:var(--muted);margin:0}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;font:500 .95rem var(--body);padding:11px 18px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--fg);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{border-color:var(--accent)}
.facts{display:flex;flex-wrap:wrap;gap:14px 36px;margin:36px 0 0;padding:0}
.facts div{display:flex;flex-direction:column;gap:2px}
.facts dd{margin:0;font-weight:500}

.query{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-family:var(--mono);font-size:.84rem;min-width:0}
.query{background:linear-gradient(var(--surface),var(--surface)) padding-box;box-shadow:inset 0 3px 0 0 var(--accent)}
.query .top{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);color:var(--muted);font-size:.74rem}
.query pre{margin:0;padding:16px;white-space:pre-wrap;line-height:1.7;font:inherit}
.query pre i{font-style:normal;color:var(--accent)}
.query .rows{border-top:1px solid var(--line)}
.query .row{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.query .row strong{font-family:var(--body);font-weight:600;font-size:.95rem}
.query .row span{color:var(--muted);font-size:.76rem}
.query .row span.when{color:var(--warm);text-align:right}
.query .foot{padding:9px 16px;color:var(--muted);font-size:.74rem}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:36px;padding-block:44px 40px}}

section.block{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px 40px;padding-block:52px;border-top:1px solid var(--line)}
.block > header h2{font:700 1.7rem/1.1 var(--display);margin:6px 0 8px;text-wrap:balance}
.block > header p{margin:0;color:var(--muted);font-size:.92rem}
@media (max-width:860px){section.block{grid-template-columns:1fr;padding-block:40px}}

.jobs{display:flex;flex-direction:column;gap:36px}
.job{border-left:2px solid var(--line);padding-left:22px;position:relative}
.job::before{content:"";position:absolute;left:-7px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.job h3{font:700 1.3rem/1.2 var(--display);margin:4px 0 2px}
.job .co{color:var(--warm);font-weight:500;margin:0 0 12px}
.job ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;max-width:68ch}
.job li::marker{color:var(--accent)}

.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:28px 32px}
.groups h3{font:600 1rem var(--body);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.groups h3 small{font:400 .74rem var(--mono);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chips li{font-size:.88rem;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:.93rem}

.edu{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.edu h3{font:700 1.35rem/1.2 var(--display);margin:6px 0 4px}
.edu p{margin:0;color:var(--muted)}
.langs{display:flex;flex-wrap:wrap;gap:12px 40px;margin:24px 0 0;padding:0}
.langs div{display:flex;flex-direction:column}
.langs dd{margin:0;font-weight:500}

.contact{display:flex;flex-direction:column;gap:14px}
.line{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding:16px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px}

.line > div{display:flex;flex-direction:column;gap:2px;min-width:0}
footer{border-top:1px solid var(--line);padding-block:24px 40px;color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---- Mejoras de diseno ---- */
:root{--shadow:0 1px 2px rgba(4,18,46,.25),0 8px 24px -12px rgba(4,18,46,.5);--glow-a:rgba(10,63,191,.35);--glow-b:rgba(20,224,210,.16);--ease:cubic-bezier(.2,.7,.2,1)}
:root[data-theme="light"]{--shadow:0 1px 2px rgba(10,29,74,.06),0 10px 28px -14px rgba(10,29,74,.22);--glow-a:rgba(11,71,196,.12);--glow-b:rgba(0,168,181,.12)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--shadow:0 1px 2px rgba(10,29,74,.06),0 10px 28px -14px rgba(10,29,74,.22);--glow-a:rgba(11,71,196,.12);--glow-b:rgba(0,168,181,.12)}}

body{background:
  radial-gradient(900px 520px at 85% -120px,var(--glow-a),transparent 70%),
  radial-gradient(700px 420px at -10% 220px,var(--glow-b),transparent 70%) no-repeat,
  var(--bg);background-repeat:no-repeat}
::selection{background:var(--accent);color:var(--accent-ink)}

/* Barra translucida con desenfoque */
header.bar{background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px)}
.bar nav a{position:relative;transition:color .2s,border-color .2s,background .2s}
.bar nav a.on{color:var(--fg)}
@media (min-width:901px){
  .bar nav a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--grad);transform:scaleX(0);transition:transform .25s var(--ease)}
  .bar nav a:hover::after,.bar nav a.on::after{transform:scaleX(1)}
}
@media (max-width:900px){.bar nav a.on{border-color:var(--accent);color:var(--accent)}}

/* Linea de pulso (motivo del logo) bajo el nombre */
.pulse{display:block;width:min(260px,70%);height:22px;margin:-6px 0 14px;color:var(--accent)}
.pulse path{fill:none;stroke:url(#pg);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.6s .2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* Botones */
.btn{transition:transform .15s var(--ease),border-color .2s,background .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 18px -8px var(--accent)}
.btn.primary:hover{box-shadow:0 10px 24px -8px var(--accent)}

/* Datos rapidos como tarjetas pequenas */
.facts{gap:12px}
.facts div{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--surface) 70%,transparent)}

/* Tarjetas con sombra suave */
.query,.edu,.line{box-shadow:var(--shadow)}
.query .row{transition:background .2s}
.query .row:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}

/* Encabezados de seccion con numero */
main{counter-reset:sec}
section.block{counter-increment:sec}
.block > header .mono::before{content:"0" counter(sec) " ";color:var(--accent);font-weight:500}
.block > header h2{background:linear-gradient(var(--fg),var(--fg));-webkit-background-clip:text;background-clip:text}
.block > header{position:relative}
@media (min-width:861px){.block > header{position:sticky;top:96px;align-self:start}}

/* Linea de tiempo con degradado */
.job{border-left:2px solid transparent;border-image:var(--grad) 1}
.job::before{background:var(--grad);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.job ul{color:color-mix(in srgb,var(--fg) 86%,var(--muted))}

/* Chips interactivos */
.chips li{transition:border-color .2s,color .2s,transform .15s var(--ease)}
.chips li:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.groups h3 small{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.plain li{padding-left:16px;position:relative}
.plain li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* Educacion y contacto */
.edu{position:relative;overflow:hidden}
.edu::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad)}
.line{transition:border-color .2s,transform .2s var(--ease)}
.line:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}

/* Aparicion suave al hacer scroll */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){
  .reveal{opacity:1;transform:none;transition:none}
  .pulse path{animation:none;stroke-dashoffset:0}
  .btn,.chips li{transition:none}
}
footer a{text-decoration:none;display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);border-radius:50%}
footer a:hover{border-color:var(--accent);color:var(--accent)}
</style>

let L="es";
const root=document.documentElement;
const mq=matchMedia("(prefers-color-scheme: light)");

const isLight=()=>root.dataset.theme?root.dataset.theme==="light":mq.matches;
function paintTheme(){
  const b=document.getElementById("theme-toggle"),light=isLight();
  b.textContent=light?"☾":"☀";
  const lbl=L==="es"?(light?"Cambiar a modo oscuro":"Cambiar a modo claro"):(light?"Switch to dark mode":"Switch to light mode");
  b.setAttribute("aria-label",lbl);b.title=lbl;
}

let io1,io2;
function enhance(){
  io1&&io1.disconnect();io2&&io2.disconnect();
  const links=[...document.querySelectorAll("#nav a")];
  if("IntersectionObserver" in window){
    io1=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){links.forEach(a=>{const on=a.getAttribute("href")==="#"+en.target.id;a.classList.toggle("on",on);if(on&&a.scrollIntoView&&matchMedia("(max-width:900px)").matches){a.parentNode.scrollTo({left:a.offsetLeft-20,behavior:"smooth"})}})}})},{rootMargin:"-45% 0px -50% 0px"});
    document.querySelectorAll("main section").forEach(s=>io1.observe(s));
    io2=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");io2.unobserve(en.target)}})},{rootMargin:"0px 0px -8% 0px"});
    document.querySelectorAll(".job,.groups > div,.edu,.langs,.line,.query").forEach(el=>{el.classList.add("reveal");io2.observe(el)});
  }
}
document.addEventListener("click",e=>{
  if(e.target.closest("#theme-toggle")){
    root.dataset.theme=isLight()?"dark":"light";
    try{localStorage.setItem("cv-theme",root.dataset.theme)}catch(err){}
    paintTheme();return;
  }
  const lb=e.target.closest(".lang button");
  if(lb){L=lb.dataset.lang;try{localStorage.setItem("cv-lang",L)}catch(e){}render();return}
  const cb=e.target.closest("[data-copy]");
  if(cb){
    const done=()=>{cb.textContent=C.co[L][3]+" ✓";setTimeout(()=>{cb.textContent=C.co[L][2]+" ⧉"},1600)};
    const sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById(cb.dataset.target));const s=getSelection();s.removeAllRanges();s.addRange(r)};
    try{navigator.clipboard.writeText(cb.dataset.copy).then(done,sel)}catch(err){sel()}
  }
});
render();
